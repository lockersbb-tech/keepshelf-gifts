<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Gift list</title>
<style>
  :root {
    --bg: #f6f1e8; --card: #fffdf8; --text: #2a221c; --muted: #7a6a5c; --border: #e6dccd;
    --accent: #b0563a; --accent-text: #fff; --done: #5f8a5a; --chip: #efe6d8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1915; --card: #28221d; --text: #f1e9de; --muted: #a8998a; --border: #3a322b;
      --accent: #d9774f; --done: #8fbf89; --chip: #332b24; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: 30px; line-height: 1.15; margin: 4px 0 6px; }
  .sub { color: var(--muted); margin: 0 0 6px; }
  .shh { background: var(--chip); border-radius: 12px; padding: 10px 14px; margin: 16px 0 22px; font-size: 14px; }
  .item { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px;
    display: grid; grid-template-columns: 76px 1fr; gap: 14px; margin-bottom: 12px; }
  .item.claimed { opacity: .62; }
  .pic { width: 76px; height: 76px; border-radius: 10px; background: #fff; object-fit: contain; }
  .emoji { width: 76px; height: 76px; border-radius: 10px; background: var(--chip); display: flex;
    align-items: center; justify-content: center; font-size: 36px; }
  .title { font-weight: 600; font-size: 17px; margin: 0; }
  .star { display: inline-block; background: var(--accent); color: var(--accent-text); font-size: 11px; font-weight: 700;
    letter-spacing: .04em; border-radius: 99px; padding: 2px 8px; margin-bottom: 4px; }
  .meta { color: var(--muted); font-size: 13.5px; margin: 2px 0 0; }
  .note { font-style: italic; font-size: 14px; margin: 6px 0 0; }
  .buy { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .buy a { font-size: 13.5px; text-decoration: none; color: var(--text); border: 1px solid var(--border);
    border-radius: 99px; padding: 5px 11px; background: var(--bg); }
  .buy a b { color: var(--accent); }
  .claim { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 11px 16px; cursor: pointer; }
  .get { background: var(--accent); color: var(--accent-text); width: 100%; }
  .ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 8px 12px; font-weight: 500; }
  .done { color: var(--done); font-weight: 600; }
  input { font: inherit; flex: 1; min-width: 140px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); }
  .msg { text-align: center; color: var(--muted); padding: 60px 10px; }
  .pool { background: var(--chip); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; }
  .poolLine { margin: 0; font-size: 14.5px; }
  .bar { height: 8px; border-radius: 99px; background: var(--border); overflow: hidden; }
  .barFill { height: 8px; background: var(--done); border-radius: 99px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; }
</style>
</head>
<body>
<main id="app"><p class="msg">Loading the list…</p></main>
<script>
// Public by design: this is the same anon key the Keepshelf app ships with. Everything goes through
// the get_gift_list / claim_gift / unclaim_gift database functions (see supabase/schema_gift_lists.sql);
// the tables themselves can't be read with it.
const SUPABASE_URL = 'https://ysoxlomqohbpdeowyxex.supabase.co';
const SUPABASE_KEY = 'sb_publishable_MjAMToeQqkhjZfMnLYxiSg_z9QKvgXN';
const OCCASION_EMOJI = { birthday: '🎂', christmas: '🎄', any: '🎁' };

const app = document.getElementById('app');
const listId = decodeURIComponent(location.hash.slice(1));
const claimKey = (item) => `keepshelf-claim:${listId}:${item}`;
let list = null;
let openForm = null;

async function rpc(fn, args) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(args),
  });
  if (!res.ok) throw new Error(`Server said ${res.status}`);
  return res.json();
}

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c != null && c !== false) node.append(c);
  return node;
}

const safeUrl = (u) => (typeof u === 'string' && /^https?:\/\//.test(u) ? u : null);

async function load() {
  if (!/^[0-9a-f-]{36}$/i.test(listId)) return showMessage('This link looks incomplete — ask for it to be sent again.');
  try {
    list = await rpc('get_gift_list', { p_id: listId });
    if (!list) return showMessage('This list isn’t shared any more.');
    render();
  } catch (e) {
    showMessage('Couldn’t load the list. Check your connection and refresh.');
  }
}

function showMessage(text) { app.replaceChildren(el('p', { class: 'msg' }, text)); }

async function claim(key, name) {
  try {
    const token = await rpc('claim_gift', { p_id: listId, p_item: key, p_name: name.trim() });
    if (token) localStorage.setItem(claimKey(key), token);
    else alert('Someone else just said they’re getting this one!');
  } catch { alert('Couldn’t save that — please try again.'); }
  openForm = null;
  load();
}

async function unclaim(key) {
  const token = localStorage.getItem(claimKey(key));
  if (!token) return;
  try {
    await rpc('unclaim_gift', { p_id: listId, p_item: key, p_token: token });
    localStorage.removeItem(claimKey(key));
  } catch { alert('Couldn’t undo that — please try again.'); }
  load();
}

const pledgeKey = (id) => `keepshelf-pledge:${listId}:${id}`;
const fmt = (n) => Number(n).toLocaleString(undefined, { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });

async function pledge(key, name, amount) {
  const value = Number(String(amount).replace(/[^0-9.]/g, ''));
  if (!(value > 0)) { alert('Please enter an amount.'); return; }
  try {
    const res = await rpc('pledge_gift', { p_id: listId, p_item: key, p_name: name.trim(), p_amount: value });
    if (res && res.token) localStorage.setItem(pledgeKey(res.id), res.token);
  } catch { alert('Couldn’t save that — please try again.'); }
  openForm = null;
  load();
}

async function unpledge(id) {
  const token = localStorage.getItem(pledgeKey(id));
  if (!token) return;
  try {
    await rpc('unpledge_gift', { p_id: listId, p_pledge: id, p_token: token });
    localStorage.removeItem(pledgeKey(id));
  } catch { alert('Couldn’t undo that — please try again.'); }
  load();
}

// "Chip in" pool: everyone's pledges towards one gift, against its cheapest price when known.
function poolArea(item, claimed) {
  const pledges = (list.pledges || {})[item.key] || [];
  const target = (item.buy || []).map((b) => b.price).find((p) => typeof p === 'number');
  const raised = pledges.reduce((sum, p) => sum + Number(p.amount), 0);
  if (pledges.length === 0 && (claimed || openForm !== `pool:${item.key}`)) return null;
  const funded = target && raised >= target;
  const names = pledges.map((p) => `${p.name || 'Someone'} ${fmt(p.amount)}`).join(', ');
  const mine = pledges.filter((p) => localStorage.getItem(pledgeKey(p.id)));
  const pct = target ? Math.min(100, Math.round((raised / target) * 100)) : 0;
  return el('div', { class: 'pool' },
    pledges.length > 0 && el('p', { class: 'poolLine' },
      funded ? '🎉 Fully funded! ' : '💰 Chipping in: ',
      el('b', {}, target ? `${fmt(raised)} of ${fmt(target)}` : `${fmt(raised)} so far`)),
    target && pledges.length > 0 && el('div', { class: 'bar' }, el('div', { class: 'barFill', style: `width:${pct}%` })),
    names && el('p', { class: 'meta' }, names),
    ...mine.map((p) => el('div', { class: 'claim' },
      el('span', { class: 'done' }, `✓ You chipped in ${fmt(p.amount)}`),
      el('button', { class: 'ghost', onclick: () => unpledge(p.id) }, 'Undo'))));
}

function itemCard(item) {
  const claimedBy = list.claims[item.key];
  const claimed = claimedBy !== undefined;
  const mine = claimed && localStorage.getItem(claimKey(item.key));
  const pledges = (list.pledges || {})[item.key] || [];
  const target = (item.buy || []).map((b) => b.price).find((p) => typeof p === 'number');
  const funded = target && pledges.reduce((s, p) => s + Number(p.amount), 0) >= target;
  const emojiBox = () => el('div', { class: 'emoji', 'aria-hidden': 'true' }, item.emoji || '🎁');
  const image = safeUrl(item.imageUrl)
    ? el('img', { class: 'pic', src: item.imageUrl, alt: '', loading: 'lazy',
        onerror: (e) => e.target.replaceWith(emojiBox()) })
    : emojiBox();

  const buy = (item.buy || []).filter((b) => safeUrl(b.url)).map((b) =>
    el('a', { href: b.url, target: '_blank', rel: 'noopener noreferrer' }, el('b', {}, b.priceText), ` at ${b.store} ↗`));

  let claimArea;
  if (mine) {
    claimArea = el('div', { class: 'claim' }, el('span', { class: 'done' }, '✓ You’re getting this'),
      el('button', { class: 'ghost', onclick: () => unclaim(item.key) }, 'Undo'));
  } else if (claimed) {
    claimArea = el('div', { class: 'claim' }, el('span', { class: 'done' }, `✓ ${claimedBy || 'Someone'} is getting this`));
  } else if (openForm === item.key) {
    const input = el('input', { placeholder: 'Your name (optional)', maxlength: '40', 'aria-label': 'Your name' });
    claimArea = el('form', { class: 'claim', onsubmit: (e) => { e.preventDefault(); claim(item.key, input.value); } },
      input, el('button', { class: 'get', type: 'submit', style: 'width:auto' }, 'Confirm'),
      el('button', { class: 'ghost', type: 'button', onclick: () => { openForm = null; render(); } }, 'Cancel'));
    setTimeout(() => input.focus(), 0);
  } else if (openForm === `pool:${item.key}`) {
    const amount = el('input', { placeholder: 'Amount', inputmode: 'decimal', maxlength: '9', 'aria-label': 'Amount', style: 'max-width:110px' });
    const name = el('input', { placeholder: 'Your name (optional)', maxlength: '40', 'aria-label': 'Your name' });
    claimArea = el('form', { class: 'claim', onsubmit: (e) => { e.preventDefault(); pledge(item.key, name.value, amount.value); } },
      amount, name, el('button', { class: 'get', type: 'submit', style: 'width:auto' }, 'Chip in'),
      el('button', { class: 'ghost', type: 'button', onclick: () => { openForm = null; render(); } }, 'Cancel'));
    setTimeout(() => amount.focus(), 0);
  } else if (funded) {
    claimArea = null;
  } else {
    claimArea = el('div', { class: 'claim' },
      pledges.length === 0 && el('button', { class: 'get', style: 'flex:2', onclick: () => { openForm = item.key; render(); } }, '🎁 I’ll get this'),
      el('button', { class: pledges.length ? 'get' : 'ghost', style: 'flex:1;padding:11px 14px', onclick: () => { openForm = `pool:${item.key}`; render(); } },
        pledges.length ? '💰 Chip in too' : '💰 Chip in'));
  }
  const pool = poolArea(item, claimed);

  return el('article', { class: `item${claimed && !mine ? ' claimed' : ''}` },
    image,
    el('div', {},
      item.priority && el('span', { class: 'star' }, '⭐ REALLY WANTS THIS'),
      el('p', { class: 'title' }, item.title),
      el('p', { class: 'meta' }, [item.type, item.maker].filter(Boolean).join(' · ')),
      item.note && el('p', { class: 'note' }, `“${item.note}”`),
      buy.length > 0 && el('div', { class: 'buy' }, ...buy)),
    pool && el('div', { style: 'grid-column:1/-1' }, pool),
    claimArea);
}

function render() {
  document.title = list.title;
  // Taken = someone's buying it, or the chip-in pool has reached its price.
  const taken = (i) => {
    if (list.claims[i.key] !== undefined) return true;
    const target = (i.buy || []).map((b) => b.price).find((p) => typeof p === 'number');
    const raised = ((list.pledges || {})[i.key] || []).reduce((s, p) => s + Number(p.amount), 0);
    return !!target && raised >= target;
  };
  const items = [...list.items].sort((a, b) => taken(a) - taken(b));
  const left = items.filter((i) => !taken(i)).length;
  app.replaceChildren(
    el('h1', {}, `${OCCASION_EMOJI[list.occasion] || '🎁'} ${list.title}`),
    el('p', { class: 'sub' }, `${items.length} ${items.length === 1 ? 'idea' : 'ideas'} · ${left} still up for grabs`),
    el('div', { class: 'shh' },
      'Tap “I’ll get this” on anything you’re buying, or “Chip in” to share a bigger gift with others — so nobody doubles up. ',
      list.from_name ? `${list.from_name} won’t see who’s getting what in the app — shh! 🤫` : 'The person who made the list won’t see it in the app — shh! 🤫'),
    ...items.map(itemCard),
    el('footer', {}, 'Made with Keepshelf'));
}

window.addEventListener('hashchange', () => location.reload());
document.addEventListener('visibilitychange', () => { if (!document.hidden && list) load(); });
load();
</script>
</body>
</html>
